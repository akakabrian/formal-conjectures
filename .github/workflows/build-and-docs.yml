name: WOWII 217 Exact Lake Build

on:
  push:
    branches:
      - wowii217-lake-build-webtest

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lean toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Run exact lake build
        id: build
        shell: bash
        run: |
          mkdir -p ci/wowii217-exact-build
          set +e
          {
            echo '$ lake build +FormalConjectures.WrittenOnTheWallII.GraphConjecture217Attempt'
            lake build +FormalConjectures.WrittenOnTheWallII.GraphConjecture217Attempt
          } > ci/wowii217-exact-build/build.log 2>&1
          status=$?
          set -e
          {
            echo "commit=${GITHUB_SHA}"
            echo "build_exit_code=${status}"
            date -u +"finished_utc=%Y-%m-%dT%H:%M:%SZ"
          } > ci/wowii217-exact-build/status.txt
          sha256sum \
            ci/wowii217-exact-build/build.log \
            ci/wowii217-exact-build/status.txt \
            > ci/wowii217-exact-build/SHA256SUMS
          echo "exit_status=${status}" >> "$GITHUB_OUTPUT"

      - name: Publish exact compiler transcript
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add -f ci/wowii217-exact-build/
          git commit -m "ci: publish WOWII 217 exact lake build [skip ci]" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Fail job if Lean failed
        if: steps.build.outputs.exit_status != '0'
        run: exit 1
