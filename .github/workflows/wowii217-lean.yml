name: WOWII 217 Lean

on:
  push:
    branches:
      - codex/wowii-217-formalization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean and warm dependencies
        id: lean-action
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "+FormalConjectures.WrittenOnTheWallII.GraphConjecture217Attempt"
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Capture exact target build transcript
        if: always()
        shell: bash
        run: |
          mkdir -p ci
          {
            echo "commit=${GITHUB_SHA}"
            echo "lean_action_outcome=${{ steps.lean-action.outcome }}"
            date -u +"started_utc=%Y-%m-%dT%H:%M:%SZ"
          } > ci/wowii217-status.txt

          set +e
          lake build +FormalConjectures.WrittenOnTheWallII.GraphConjecture217Attempt \
            > ci/wowii217-build.log 2>&1
          code=$?
          set -e

          echo "build_exit_code=${code}" >> ci/wowii217-status.txt
          date -u +"finished_utc=%Y-%m-%dT%H:%M:%SZ" >> ci/wowii217-status.txt
          sha256sum ci/wowii217-build.log ci/wowii217-status.txt > ci/wowii217.sha256

      - name: Commit compiler transcript to isolated branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/wowii217-build.log ci/wowii217-status.txt ci/wowii217.sha256
          if ! git diff --cached --quiet; then
            git commit -m "ci: record WOWII 217 Lean transcript [skip ci]"
            git push
          fi
