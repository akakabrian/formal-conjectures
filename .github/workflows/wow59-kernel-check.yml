name: Verify WOWII 59 counterexample

on:
  push:
    branches:
      - agent/wowii-59-kernel-check
    paths-ignore:
      - lean-ci.log
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Kernel-check certificate
        id: verify
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            echo '$ lake build FormalConjectures.WrittenOnTheWallII.GraphConjecture59Counterexample'
            lake build FormalConjectures.WrittenOnTheWallII.GraphConjecture59Counterexample
            echo '$ lake env lean -DwarningAsError=true WOW59Check.lean'
            lake env lean -DwarningAsError=true WOW59Check.lean
          } > lean-ci.log 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> lean-ci.log
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow59-lean-ci-log-${{ github.run_id }}
          path: lean-ci.log

      - name: Publish compiler log
        if: always() && github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f lean-ci.log
          git commit -m "ci: publish WOWII 59 Lean log" || true
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Fail job when Lean failed
        if: steps.verify.outputs.exit_status != '0'
        run: exit 1
