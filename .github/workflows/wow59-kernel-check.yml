name: WOWII 59 Lean

# Isolated branch-push harness for the structural, axiom-free counterexample certificate.
concurrency:
  group: wowii59-kernel-check
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/wowii-59-kernel-check
    paths-ignore:
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Verify and capture compiler log
        id: verify
        shell: bash
        run: |
          mkdir -p ci
          set +e
          {
            echo '$ lake build +FormalConjectures.WrittenOnTheWallII.GraphConjecture59Counterexample'
            lake build +FormalConjectures.WrittenOnTheWallII.GraphConjecture59Counterexample
            echo '$ lake env lean -DwarningAsError=true WOW59Check.lean'
            lake env lean -DwarningAsError=true WOW59Check.lean
          } > ci/wowii59-build.log 2>&1
          status=$?
          set -e

          {
            echo "commit=${GITHUB_SHA}"
            echo "build_exit_code=${status}"
            date -u +"finished_utc=%Y-%m-%dT%H:%M:%SZ"
          } > ci/wowii59-status.txt
          sha256sum ci/wowii59-build.log ci/wowii59-status.txt > ci/wowii59.sha256
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"

      - name: Publish compiler transcript on isolated branch
        if: always() && github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f ci/wowii59-build.log ci/wowii59-status.txt ci/wowii59.sha256
          git commit -m "ci: publish WOWII 59 Lean transcript [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload compiler transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wowii59-lean-${{ github.run_id }}
          path: ci/

      - name: Fail job when Lean failed
        if: steps.verify.outputs.exit_status != '0'
        run: exit 1
