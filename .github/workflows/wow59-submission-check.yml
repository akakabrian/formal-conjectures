name: WOWII 59 submission check

on:
  push:
    branches:
      - ci/wowii-59-submit-check
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build Conjecture 59 statement
        run: lake build +FormalConjectures.WrittenOnTheWallII.GraphConjecture59

      - name: Audit submission scope
        run: |
          git diff --exit-code 8ffc8eb13319db12140cbdfa031db73263fd9b4f -- \
            FormalConjectures/WrittenOnTheWallII/GraphConjecture59.lean
          test "$(git diff --name-only ca8e34cae845185b1fc18d3148deaee146ee1ee8 8ffc8eb13319db12140cbdfa031db73263fd9b4f | wc -l)" -eq 1
          git diff --name-only ca8e34cae845185b1fc18d3148deaee146ee1ee8 8ffc8eb13319db12140cbdfa031db73263fd9b4f | grep -Fx \
            FormalConjectures/WrittenOnTheWallII/GraphConjecture59.lean
